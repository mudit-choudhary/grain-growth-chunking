# Publish to PyPI on every GitHub release.
#
# Authentication is Trusted Publishing: GitHub signs a short-lived OIDC token
# that PyPI verifies against the publisher configured for this repository, so
# no API token is stored anywhere. Configure it once at
# https://pypi.org/manage/account/publishing/ with:
#
#   PyPI project name : grain-growth-chunking
#   Owner             : mudit-choudhary
#   Repository        : grain-growth-chunking
#   Workflow          : publish.yml
#   Environment       : pypi
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:        # lets you re-run it by hand if a release fails

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Run the tests against the built wheel
        run: |
          python -m pip install dist/*.whl pytest
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi              # matches the publisher configured on PyPI
    permissions:
      id-token: write              # required: this is what signs the OIDC token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
