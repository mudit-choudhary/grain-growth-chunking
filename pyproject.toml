[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grain-growth-chunking"
version = "1.0.0"
description = "Structure-aware document chunking: chunks grow along a document's own grain and never cross a structural barrier."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mudit Choudhary" }]
keywords = ["chunking", "rag", "retrieval", "nlp", "document-parsing", "text-splitting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []                       # standard library only, on purpose

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mudit-choudhary/grain-growth-chunking"
Evaluation = "https://github.com/mudit-choudhary/Anneal/blob/main/evals/Reports/Report.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
